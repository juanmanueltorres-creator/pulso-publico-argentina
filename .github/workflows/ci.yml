name: CI

on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test CAMMESA XLSX extractor
        run: python3 scripts/cammesa_xlsx_test.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      # Temporary live probe for PR #24; remove after the results are inspected.
      - name: Live CONAE smoke (diagnostic only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/fix-conae-hotspot-fallback-20261112'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          npm run refresh:conae || true
          node --input-type=module <<'NODE'
          const endpoints = [
            'https://geoservicios.conae.gov.ar/geoserver/GeoServiciosCONAE/wfs?service=WFS&version=2.0.0&request=GetCapabilities',
            'https://geoservicios.conae.gov.ar/geoserver/GeoServiciosCONAE/ows?service=WFS&version=2.0.0&request=GetCapabilities',
            'https://geoservicios2.conae.gov.ar/geoserver/GeoServiciosCONAE/wfs?service=WFS&version=2.0.0&request=GetCapabilities',
            'https://catalogos5.conae.gov.ar/catalogofocos/default.aspx',
          ]
          const checks = endpoints.map(async (url) => {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(15000) })
              console.log('PROBE', url, response.status, response.headers.get('content-type'))
            } catch (error) {
              console.log('PROBE_FAIL', url, error.message, error.cause?.code, error.cause?.message)
            }
          })
          await Promise.all(checks)
          const variants = [
            {start:'2026-11-11',end:'2026-11-12',satellite:'NOAA20',bbox:'-21.7_-73.7_-55.2_-53.5'},
            {start:'11/11/2026',end:'12/11/2026',satellite:'NOAA20',bbox:'-21.7_-73.7_-55.2_-53.5'},
            {start:'2026-11-11',end:'2026-11-12',satellite:'SNPP',bbox:'-21.7_-73.7_-55.2_-53.5'},
            {start:'11/11/2026',end:'12/11/2026',satellite:'SNPP',bbox:'-21.7_-73.7_-55.2_-53.5'},
            {start:'2026-11-11',end:'2026-11-12',satellite:'NOAA20',bbox:''},
            {start:'11/11/2026',end:'12/11/2026',satellite:'NOAA20',bbox:''},
          ]
          for (const variant of variants) {
            const p = new URLSearchParams({
              dateStart:variant.start,dateEnd:variant.end,satelite:variant.satellite,
              Confianza:'0',Coordenadas:variant.bbox,tipoA:'dib',prov:'',dpto:'',
              formato:'csv',tipoTot:'det',idTot:'',nAgrup:'agrupSin'
            })
            try {
              const response = await fetch('https://catalogos5.conae.gov.ar/catalogofocos/search_date.aspx?'+p.toString(),{signal:AbortSignal.timeout(15000)})
              const html=await response.text()
              console.log('CATALOG_PROBE', JSON.stringify(variant),
                'status',response.status,'length',html.length,
                'hasToken',/formData\\.append\\(/.test(html),
                'noResults',/No se encontraron Focos de Calor/i.test(html))
            } catch(error) {
              console.log('CATALOG_PROBE_FAIL',JSON.stringify(variant),error.message,error.cause?.code)
            }
          }
          NODE
