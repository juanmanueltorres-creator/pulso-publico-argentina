name: CI

on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test CAMMESA XLSX extractor
        run: python3 scripts/cammesa_xlsx_test.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Probe NASA FIRMS 24h CSV sources (temporary)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/fix-conae-hotspot-fallback-20261112'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            'https://firms.modaps.eosdis.nasa.gov/data/active_fire/suomi-npp-viirs-c2/csv/SUOMI_VIIRS_C2_Global_24h.csv',
            'https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-20-viirs-c2/csv/J1_VIIRS_C2_Global_24h.csv',
            'https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-20-viirs-c2/csv/J1_VIIRS_C2_South_America_24h.csv',
            'https://firms.modaps.eosdis.nasa.gov/data/active_fire/suomi-npp-viirs-c2/csv/SUOMI_VIIRS_C2_South_America_24h.csv',
          ]
          for(const url of urls) {
            const controller=new AbortController()
            const timer=setTimeout(()=>controller.abort(),20000)
            try{
              const r=await fetch(url,{signal:controller.signal,redirect:'follow'})
              const chunk=await r.body?.getReader()?.read()
              const first=new TextDecoder().decode(chunk?.value??new Uint8Array()).split('\\n').slice(0,2).join(' ').slice(0,350)
              console.log('FIRMS_PROBE',url,'HTTP',r.status,'type',r.headers.get('content-type'),'length',r.headers.get('content-length'),'first',JSON.stringify(first))
            }catch(e){console.log('FIRMS_PROBE_FAIL',url,e.message,e.cause?.code)}
            finally{clearTimeout(timer)}
          }
          NODE
