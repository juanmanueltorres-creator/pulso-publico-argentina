name: Run CONAE Once

on:
  push:
    branches: ['feat/v2-territorial-design']
    paths:
      - '.github/workflows/run-conae-once.yml'

permissions:
  contents: write

concurrency:
  group: refresh-territorial
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Diagnose CONAE WFS connectivity
        shell: bash
        run: |
          set +e
          getent hosts geoservicios.conae.gov.ar || true
          curl --connect-timeout 10 --max-time 20 --silent --show-error \
            --output /tmp/conae-capabilities.xml \
            --write-out 'curl_http=%{http_code} remote_ip=%{remote_ip} ssl_verify=%{ssl_verify_result} connect=%{time_connect}s total=%{time_total}s\n' \
            'https://geoservicios.conae.gov.ar/geoserver/GeoServiciosCONAE/wfs?service=WFS&version=2.0.0&request=GetCapabilities'
          status=$?
          echo "curl_exit=${status}"
          if [ -f /tmp/conae-capabilities.xml ]; then
            wc -c /tmp/conae-capabilities.xml
            if grep -q 'GeoServiciosCONAE:FocosDeCalorVIIRS' /tmp/conae-capabilities.xml; then
              echo 'viirs_layer=present'
            else
              echo 'viirs_layer=absent'
            fi
          fi
          exit 0

      - name: Refresh CONAE snapshot
        run: npm run refresh:conae

      - name: Commit snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/data/hotspots.json)" ]; then
            echo 'CONAE snapshot unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/hotspots.json
          git commit -m 'data: seed CONAE hotspots'
          git push origin "HEAD:${GITHUB_REF_NAME}"
