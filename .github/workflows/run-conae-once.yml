name: Run CONAE Once

on:
  push:
    branches: ['feat/v2-territorial-design']
    paths:
      - '.github/workflows/run-conae-once.yml'

permissions:
  contents: write

concurrency:
  group: refresh-territorial
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inspect public CONAE result endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          import re

          url = ('https://catalogos5.conae.gov.ar/catalogofocos/search_date.aspx?'
                 'dateStart=2026-08-27&dateEnd=2026-08-28&satelite=NOAA20&Confianza=0&'
                 'Coordenadas=-21.7_-73.7_-55.2_-53.5&tipoA=dib&prov=&dpto=&formato=csv&'
                 'tipoTot=det&idTot=&nAgrup=agrupSin')
          req = Request(url, headers={'User-Agent':'PulsoPublicoArgentina/0.1 (+https://github.com/juanmanueltorres-creator/pulso-publico-argentina)'})
          with urlopen(req, timeout=60) as r:
              html = r.read().decode('utf-8', errors='replace')
              print('status=', r.status, 'bytes=', len(html))

          print('candidate endpoints=')
          patterns = [
              r'["\']([^"\']+\.aspx(?:\?[^"\']*)?)["\']',
              r'["\']([^"\']+\.(?:json|geojson|kml)(?:\?[^"\']*)?)["\']',
              r'(?:xhr\.open|\.ajax|fetch\s*\().{0,450}',
              r'.{0,300}(?:mapa|foco|marker|feature|latitud|longitud|latitude|longitude).{0,500}',
          ]
          seen=set()
          for pattern in patterns:
              for m in re.finditer(pattern, html, flags=re.I|re.S):
                  value = m.group(1) if m.lastindex else m.group(0)
                  value = re.sub(r'\s+', ' ', value).strip()
                  if '__VIEWSTATE' in value or len(value) > 1000:
                      continue
                  if value not in seen:
                      seen.add(value)
                      print(value[:950])
          PY
