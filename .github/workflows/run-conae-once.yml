name: Run CONAE Once

on:
  push:
    branches: ['feat/v2-territorial-design']
    paths:
      - '.github/workflows/run-conae-once.yml'

permissions:
  contents: write

concurrency:
  group: refresh-territorial
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inspect CONAE catalog form
        shell: bash
        run: |
          set -euo pipefail
          url='https://catalogos5.conae.gov.ar/catalogofocos/default.aspx'
          getent hosts catalogos5.conae.gov.ar || true
          curl --connect-timeout 10 --max-time 30 --silent --show-error --location \
            --cookie-jar /tmp/conae-cookies.txt \
            --output /tmp/conae-catalog.html \
            --write-out 'curl_http=%{http_code} remote_ip=%{remote_ip} connect=%{time_connect}s total=%{time_total}s\n' \
            "$url"
          wc -c /tmp/conae-catalog.html
          python3 - <<'PY'
          from html.parser import HTMLParser

          class FormParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms=[]
                  self.fields=[]
                  self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag == 'form':
                      self.forms.append({k:a.get(k) for k in ('id','name','method','action')})
                  elif tag in ('input','select','button'):
                      self.fields.append({k:a.get(k) for k in ('id','name','type','value')})
                  elif tag == 'script' and a.get('src'):
                      self.scripts.append(a['src'])

          text=open('/tmp/conae-catalog.html', encoding='utf-8', errors='replace').read()
          p=FormParser(); p.feed(text)
          print('forms=', p.forms)
          print('fields=')
          for field in p.fields:
              print(field)
          print('scripts=')
          for src in p.scripts:
              print(src)
          PY
