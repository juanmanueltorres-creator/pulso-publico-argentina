name: Run CONAE Once

on:
  push:
    branches: ['feat/v2-territorial-design']
    paths:
      - '.github/workflows/run-conae-once.yml'

permissions:
  contents: write

concurrency:
  group: refresh-territorial
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe CONAE CSV export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from http.cookiejar import CookieJar
          from urllib.parse import urlencode
          from urllib.request import build_opener, HTTPCookieProcessor, Request

          URL = 'https://catalogos5.conae.gov.ar/catalogofocos/default.aspx'

          class HiddenParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hidden = {}
              def handle_starttag(self, tag, attrs):
                  if tag != 'input': return
                  a = dict(attrs)
                  if a.get('type') == 'hidden' and a.get('name'):
                      self.hidden[a['name']] = a.get('value', '')

          jar = CookieJar()
          opener = build_opener(HTTPCookieProcessor(jar))
          headers = {'User-Agent': 'PulsoPublicoArgentina/0.1 (+https://github.com/juanmanueltorres-creator/pulso-publico-argentina)'}
          with opener.open(Request(URL, headers=headers), timeout=30) as r:
              html = r.read().decode('utf-8', errors='replace')
              print('get_status=', r.status, 'bytes=', len(html))

          p = HiddenParser(); p.feed(html)
          required = ['__VIEWSTATE','__VIEWSTATEGENERATOR','__EVENTVALIDATION']
          for key in required:
              if key not in p.hidden:
                  raise SystemExit(f'missing hidden field: {key}')

          data = {
              **{k: p.hidden[k] for k in required},
              '__EVENTTARGET': 'btnBuscar',
              '__EVENTARGUMENT': '',
              'optCat': 'focos',
              'ddSatelites': 'NOAA20',
              'txtFechaMin': '27/08/2026',
              'txtFechaMax': '28/08/2026',
              'ddConfianzas': '0',
              'optArea': 'dib',
              'latSupIzq': '-21.7',
              'longSupIzq': '-73.7',
              'latInfDer': '-55.2',
              'longInfDer': '-53.5',
              'optFormato': 'csv',
              'optTot': 'det',
          }
          req = Request(URL, data=urlencode(data).encode(), headers={**headers, 'Content-Type':'application/x-www-form-urlencoded'})
          with opener.open(req, timeout=60) as r:
              body = r.read()
              print('post_status=', r.status)
              print('content_type=', r.headers.get('Content-Type'))
              print('content_disposition=', r.headers.get('Content-Disposition'))
              print('final_url=', r.geturl())
              print('bytes=', len(body))
              text = body[:1200].decode('utf-8', errors='replace').replace('\r',' ')
              print('preview=', ' '.join(text.split())[:1000])
          PY
