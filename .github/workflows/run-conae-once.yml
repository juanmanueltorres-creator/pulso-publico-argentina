name: Run CONAE Once

on:
  push:
    branches: ['feat/v2-territorial-design']
    paths:
      - '.github/workflows/run-conae-once.yml'

permissions:
  contents: write

concurrency:
  group: refresh-territorial
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh CONAE snapshot
        run: npm run refresh:conae

      - name: Audit generated snapshot
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const snapshot = JSON.parse(await readFile('public/data/hotspots.json', 'utf8'))
          const byConfidence = Object.groupBy(snapshot.events, (event) => event.confidence)
          const bySatellite = Object.groupBy(snapshot.events, (event) => event.satellite ?? 'unknown')
          const summary = (groups) => Object.fromEntries(
            Object.entries(groups).map(([key, events]) => [key, events.length]),
          )
          console.log('kind=', snapshot.kind)
          console.log('events=', snapshot.events.length)
          console.log('confidence=', JSON.stringify(summary(byConfidence)))
          console.log('satellites=', JSON.stringify(summary(bySatellite)))
          console.log('all_frp_null=', snapshot.events.every((event) => event.frpMw === null))
          console.log('source=', snapshot.source.url)
          console.log('method=', snapshot.method.type)
          console.log('window_hours=', snapshot.window.hours)
          NODE

      - name: Commit snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/data/hotspots.json)" ]; then
            echo 'CONAE snapshot unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/hotspots.json
          git commit -m 'data: seed CONAE hotspots'
          git push origin "HEAD:${GITHUB_REF_NAME}"
