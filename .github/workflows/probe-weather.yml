name: Probe Weather Batches

on:
  push:
    branches: ['feat/pulso-weather-context-v3-1']
    paths:
      - 'scripts/probe-open-meteo-batches.mjs'
      - '.github/workflows/probe-weather.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Probe Open-Meteo batch sizes
        run: node scripts/probe-open-meteo-batches.mjs
