name: Refresh OpenAlex

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */12 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh OpenAlex snapshot
        run: node scripts/refresh-openalex.mjs

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          if git diff --quiet -- public/data/signals.json; then
            echo 'OpenAlex snapshot unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/signals.json
          git commit -m 'data: refresh OpenAlex signal'
          git push origin "HEAD:${GITHUB_REF_NAME}"
