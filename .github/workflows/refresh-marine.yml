name: Refresh Marine

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/refresh-marine.yml'
      - 'scripts/refresh-marine.mjs'
      - 'src/data/marineLocations.json'
  schedule:
    - cron: '41 3,15 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-marine
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh Marine API (one request for six positions)
        run: npm run refresh:marine
      - name: Commit if values changed
        id: commit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/data/marine.json)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/marine.json
          git commit -m 'data: refresh marine context'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Trigger site update
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages-preview.yml --ref main
