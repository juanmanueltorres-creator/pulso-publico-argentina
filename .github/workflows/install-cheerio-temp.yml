name: Install Cheerio Temp

on:
  push:
    branches: ['feat/v2-territorial-design']
    paths:
      - '.github/workflows/install-cheerio-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Cheerio
        run: npm install --save-dev cheerio

      - name: Commit dependency lock
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: add Cheerio dependency'
          git push origin "HEAD:${GITHUB_REF_NAME}"
