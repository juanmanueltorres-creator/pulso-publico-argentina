name: Spike CAMMESA Source

on:
  push:
    branches:
      - feat/v1-foundation
    paths:
      - .github/workflows/spike-cammesa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe CAMMESA official API and renewable iframe
        run: node scripts/spike-cammesa-source.mjs
