name: Refresh INPI

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh INPI snapshot
        run: node scripts/refresh-inpi.mjs

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          if git diff --quiet -- public/data/signals.json; then
            echo 'INPI snapshot unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/signals.json
          git commit -m 'data: refresh INPI signal'
          git push origin "HEAD:${GITHUB_REF_NAME}"
